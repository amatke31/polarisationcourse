semi: true
singleQuote: true
jsxSingleQuote: false
trailingComma: all
tabWidth: 2
useTabs: false
printWidth: 100
arrowParens: avoid
bracketSpacing: true
bracketSameLine: false
jsxBracketSameLine: false
endOfLine: lf
proseWrap: preserve
quoteProps: as-needed
plugins:
  - prettier-plugin-tailwindcss
tailwindConfig: ./tailwind.config.js
tailwindFunctions:
  - cn